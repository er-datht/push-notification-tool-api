# Local development stack: MySQL 8, this API, and the FE console. Nothing here
# is used on staging/production, where the database is a managed instance and
# the app gets its variables from the platform.
#
#   docker compose up -d            whole stack (first run builds the images)
#   docker compose up -d mysql      MySQL only — for `yarn dev` / `yarn test` on the host
#   docker compose ps               "healthy" means it accepts connections / answers /health
#   docker compose logs -f api web  follow the API and FE dev servers
#   docker compose down             stop; data survives in the volume
#   docker compose down -v          stop AND wipe the data
#
# Every value comes from .env (copy .env.example); none is written here. The
# MYSQL_* values create the container and also build the in-network
# DATABASE_URL below. CORS_ORIGIN must include http://localhost:3000 for the
# FE to call the API. If PORT is taken on the host (a local ecs-api also uses
# 8080), override it for this stack only: PORT=8081 docker compose up -d
#
# The `web` service builds from ../fe-push-notification-tool, so the two repos
# must sit side by side. Its own settings (ECS_API_URL) come from that repo's
# .env.local, which `next dev` reads from the bind mount.

services:
  mysql:
    image: mysql:8.0
    container_name: push-tool-mysql
    # utf8mb4 is the only charset that holds every Japanese character and emoji.
    # MySQL's plain "utf8" is 3 bytes and silently corrupts 4-byte characters.
    # The server stays on UTC on purpose: Prisma treats every DateTime as UTC,
    # and Asia/Tokyo is applied in application code, never in the database.
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # Scripts here run once, on first initialisation of the volume.
      - ./docker/mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: push-tool-api
    env_file: .env
    environment:
      # .env's DATABASE_URL points at 127.0.0.1 for the host workflow. Inside
      # the network the database is the `mysql` service. dotenv never overrides
      # a variable that is already set, so this one wins in the container.
      DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}
      # Repeated so a shell override (`PORT=8081 docker compose up -d`, e.g.
      # when ecs-api already holds 8080) moves the server, the published port
      # and the FE's URL together, instead of only the latter two.
      PORT: ${PORT}
    ports:
      - "${PORT}:${PORT}"
    volumes:
      - .:/app
      # Keep the image's Linux node_modules; the host's are macOS binaries.
      - /app/node_modules
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      # GET /health checks the database too.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+process.env.PORT+'/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s

  web:
    build:
      context: ../fe-push-notification-tool
      dockerfile: Dockerfile.dev
    container_name: push-tool-web
    environment:
      # The browser calls the API directly (no proxy), so this is the port
      # published on the host, not http://api:…. A process variable beats
      # .env.local in Next.
      NEXT_PUBLIC_EXPRESS_API_URL: http://localhost:${PORT}
    ports:
      - "3000:3000"
    volumes:
      - ../fe-push-notification-tool:/app
      - /app/node_modules
      # Keep the container's build cache apart from the host's `yarn dev`.
      - /app/.next
    depends_on:
      - api

volumes:
  mysql_data:
